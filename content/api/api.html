<!doctype html>
<html>
  <head>
    <title>API Reference</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <div style="width: 100vw; margin-left: calc(-50vw + 50%); height: 100vh; overflow: hidden;">
        <div id="app" style="height: 100%; width: 100%;"></div>
    </div>
    <!-- Load the Scalar API Reference -->
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <!-- Initialize the API Reference -->
    <script>
      Scalar.createApiReference('', {
        url: '/api.yaml',
        proxyUrl: 'https://proxy.scalar.com',
      })
    </script>
  </body>
</html>
